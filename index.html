<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APIKEY - SYSTEM</title>
<style>
:root {
  --bg: #05000a;
  --panel-bg: rgba(15, 0, 25, 0.85);
  --border: #2a0a45;
  --primary: #bd00ff;
  --primary-glow: rgba(189, 0, 255, 0.5);
  --text: #ffffff;
  --text-muted: #8866aa;
  --font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, 'Courier New', Courier, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { 
  min-height: 100vh; 
  background: var(--bg); 
  color: var(--text); 
  font-family: var(--font); 
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image: 
    linear-gradient(rgba(189, 0, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(189, 0, 255, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  background-position: center center;
}

/* HIỆU ỨNG NỀN PHÁT SÁNG */
body::before {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100vw; height: 100vh;
    background: radial-gradient(circle, var(--primary-glow) 0%, transparent 60%);
    opacity: 0.3;
    z-index: -1;
    pointer-events: none;
    animation: pulseBg 4s infinite alternate;
}

@keyframes pulseBg {
    0% { opacity: 0.2; }
    100% { opacity: 0.4; }
}

/* KHUNG CHÍNH */
.panel {
    width: 100%;
    max-width: 420px;
    background: var(--panel-bg);
    border: 1px solid var(--primary);
    border-radius: 20px;
    padding: 30px 24px;
    box-shadow: 0 0 30px var(--primary-glow), inset 0 0 20px rgba(189, 0, 255, 0.1);
    text-align: center;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

/* HIỆU ỨNG ÁNH SÁNG QUÉT */
.panel::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transform: skewX(-20deg);
    animation: shine 4s infinite;
}

@keyframes shine {
    100% { left: 200%; }
}

/* LOGO & TITLE */
.title {
    font-size: 28px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: 3px;
    text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--primary-glow);
    margin-bottom: 4px;
}

.subtitle {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
    letter-spacing: 2px;
    margin-bottom: 30px;
    text-transform: uppercase;
}

/* KHUNG KEY */
.key-container {
    background: #0a0010;
    border: 1px solid #3a0a5a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
    position: relative;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
}

.key-label {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
    display: block;
}

.key-display {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

#yourKey {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,255,255,0.5);
    word-break: break-all;
    text-align: left;
    flex: 1;
}

/* NÚT COPY */
.btn-copy {
    background: rgba(189, 0, 255, 0.15);
    border: 1px solid var(--primary);
    color: var(--primary);
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
    box-shadow: 0 0 10px rgba(189, 0, 255, 0.2);
}

.btn-copy:active {
    background: var(--primary);
    color: #000;
    transform: scale(0.95);
    box-shadow: 0 0 20px var(--primary-glow);
}

.btn-copy svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
}

/* TOAST THÔNG BÁO */
#toast {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--primary);
    color: #000;
    padding: 10px 24px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 800;
    font-family: var(--mono);
    letter-spacing: 1px;
    box-shadow: 0 0 20px var(--primary-glow);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    z-index: 1000;
}

#toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

/* DECORATION LINES */
.line-deco {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    width: 80%;
    margin: 0 auto 20px;
    opacity: 0.5;
}

.status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--primary);
    font-weight: 700;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--primary);
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}
</style>
</head>
<body>

<div class="panel">
    <div class="title">APIKEY</div>
    <div class="subtitle">CYBER SYSTEM INTERFACE</div>
    
    <div class="line-deco"></div>

    <div class="key-container">
        <span class="key-label">KEY CỦA BẠN</span>
        <div class="key-display">
            <div id="yourKey">DOLONG-FREE</div>
            <button class="btn-copy" onclick="copyKey()" title="Sao chép">
                <svg viewBox="0 0 24 24">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-dot"></div>
        SYSTEM ONLINE
    </div>
</div>

<div id="toast">ĐÃ SAO CHÉP!</div>

<script>
function copyKey() {
    const key = document.getElementById('yourKey').textContent;
    
    // Phương pháp copy hiện đại
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(key).then(() => {
            showToast();
        }).catch(() => {
            fallbackCopy(key);
        });
    } else {
        // Phương pháp fallback cho webview cũ
        fallbackCopy(key);
    }
}

function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    // Ẩn textarea
    textArea.style.position = "fixed";
    textArea.style.left = "-999999px";
    textArea.style.top = "-999999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
        document.execCommand('copy');
        showToast();
    } catch (err) {
        console.error('Fallback: Oops, unable to copy', err);
    }
    
    document.body.removeChild(textArea);
}

function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    
    // Rung nhẹ nếu thiết bị hỗ trợ
    if (navigator.vibrate) {
        navigator.vibrate(50);
    }

    setTimeout(() => {
        toast.classList.remove('show');
    }, 2000);
}
</script>

</body>
</html>
